<ion-content class="login-content">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo">
        <ion-icon name="qr-code-outline"></ion-icon>
      </div>
      <h1>Controlo de Ponto</h1>
      <p class="subtitle">Inicie sessão para continuar</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <ion-list lines="none">
          <ion-item class="field">
            <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
            <ion-input
              label="Email"
              labelPlacement="stacked"
              type="email"
              inputmode="email"
              autocomplete="username"
              placeholder="admin@aem.local"
              formControlName="email">
            </ion-input>
          </ion-item>
          <ion-note
            color="danger"
            class="field-error"
            *ngIf="form.controls.email.touched && form.controls.email.invalid">
            Indique um email válido
          </ion-note>

          <ion-item class="field">
            <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
            <ion-input
              label="Palavra-passe"
              labelPlacement="stacked"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="current-password"
              formControlName="password">
            </ion-input>
            <ion-button
              slot="end"
              fill="clear"
              type="button"
              [attr.aria-label]="showPassword() ? 'Ocultar palavra-passe' : 'Mostrar palavra-passe'"
              (click)="showPassword.set(!showPassword())">
              <ion-icon slot="icon-only" [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>
          <ion-note
            color="danger"
            class="field-error"
            *ngIf="form.controls.password.touched && form.controls.password.invalid">
            Introduza a palavra-passe
          </ion-note>
        </ion-list>

        <ion-text color="danger" class="form-error" *ngIf="error()">
          <p>{{ error() }}</p>
        </ion-text>

        <ion-button expand="block" type="submit" [disabled]="loading()">
          <ion-spinner *ngIf="loading()" name="crescent" slot="start"></ion-spinner>
          {{ loading() ? 'A entrar...' : 'Entrar' }}
        </ion-button>
      </form>

      <p class="hint">
        Sem conta? Peça ao administrador do sistema para criar o seu acesso.
      </p>
    </div>
  </div>
</ion-content>
