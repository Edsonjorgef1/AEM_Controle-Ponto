<ion-app>
  <ion-split-pane contentId="main-content" when="lg" [disabled]="!auth.isAuthenticated()">
    <ion-menu contentId="main-content" type="overlay" [disabled]="!auth.isAuthenticated()">
      <ion-content>
        <div class="brand">
          <ion-icon name="qr-code-outline"></ion-icon>
          <div>
            <h2>Controlo de Ponto</h2>
            <p>{{ auth.user()?.name }} · {{ roleLabel() }}</p>
          </div>
        </div>

        <ion-list lines="none">
          <ion-menu-toggle auto-hide="false" *ngFor="let link of links()">
            <ion-item
              [routerLink]="[link.url]"
              routerLinkActive="selected"
              routerDirection="root"
              detail="false">
              <ion-icon slot="start" [name]="link.icon"></ion-icon>
              <ion-label>{{ link.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>

        <ion-list lines="none" class="footer-actions">
          <ion-menu-toggle auto-hide="false">
            <ion-item button detail="false" (click)="logout()">
              <ion-icon slot="start" name="log-out-outline"></ion-icon>
              <ion-label>Terminar sessão</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
