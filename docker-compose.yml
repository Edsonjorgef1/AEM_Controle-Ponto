# PostgreSQL para desenvolvimento local.
#   docker compose up -d
# Depois: cd server && cp .env.example .env && npm run migrate && npm run seed
services:
  db:
    image: postgres:16-alpine
    container_name: controle-ponto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: controle_ponto
      POSTGRES_USER: ponto
      POSTGRES_PASSWORD: ponto
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ponto -d controle_ponto']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
